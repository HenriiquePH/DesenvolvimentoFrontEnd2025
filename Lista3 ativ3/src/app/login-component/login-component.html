<div class="cardPrincipal">
  <h2>Tela de Login</h2>

  <div>
    <label>Usuário:</label>
    <input
      class="inputPadrao"
      placeholder="Informe seu usuário"
      style="margin-bottom: 0.5rem"
      [(ngModel)]="usuario"
    />
  </div>

  <div>
    <label>Senha:</label>
    <input
      class="inputPadrao"
      placeholder="Informe sua senha"
      type="number"
      style="margin-bottom: 0.5rem"
      [(ngModel)]="senha"
    />
  </div>

  <button class="botaoPadrao" (click)="entrar()">Entrar</button>
</div>
