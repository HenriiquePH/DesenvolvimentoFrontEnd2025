<div class="cardPrincipal">
  <h2>Validação de maior número</h2>

  <div style="margin-bottom: 1rem">
    <input
      [(ngModel)]="valor1"
      class="inputPadrao"
      type="number"
      placeholder="Informe um número"
      style="margin-bottom: 0.5rem"
    />

    <input
      [(ngModel)]="valor2"
      class="inputPadrao"
      type="number"
      placeholder="Informe um número"
      style="margin-bottom: 0.5rem"
    />
  </div>

  <button class="botaoPadrao" (click)="compararValores()">
    Comparar números
  </button>

  <div *ngIf="resultado !== null" style="margin-top: 1rem; font-weight: bold">
    Maior número {{resultado}}
  </div>
</div>
