<div class="cardPrincipal" style="max-width: 400px; margin: auto; padding: 20px">
<h2>Lista de Nomes</h2>

<input
  [(ngModel)]="novoNome"
  class="inputPadrao"
  type="text"
  placeholder="Digite um nome"
  style="margin-bottom: 0.5rem"
/>

<button class="botaoPadrao" (click)="adicionarNome()">Adicionar</button>

<ul>
  <li *ngFor="let nome of listaNomes; let i = index">
    {{ nome }}
    <button class="botaoPadrao" (click)="removerNome(i)">Remover</button>
  </li>
</ul>

<!-- Contador só aparece se não for nulo -->
<p *ngIf="contador !== null" style="margin-top: 1rem; font-weight: bold">
  Total de nomes: {{ contador }}
</p>
</div>
